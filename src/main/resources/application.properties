spring.application.name=taskboard


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Schema is managed by Flyway (db/migration); Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50


jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}


spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Reminder scheduler (Layer 7a)
app.reminder.fixed-delay=PT1M
app.reminder.batch-size=100
